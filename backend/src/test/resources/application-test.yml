spring:
  datasource:
    url: jdbc:h2:mem:aksiyoncuk;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  jwt:
    access-secret: test-only-secret-with-at-least-32-bytes
  media:
    endpoint: http://localhost:9000
    region: us-east-1
    access-key: test
    secret-key: test
    bucket: test-media
    public-base-url: http://localhost:9000/test-media
    path-style-access: true
